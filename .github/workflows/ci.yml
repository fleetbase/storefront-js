name: CI

on:
    push:
        branches: [main, 'dev-**', 'feature/**']
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PNPM_VERSION: 9.15.4

jobs:
    quality:
        name: Quality and coverage
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
            - run: pnpm run lint
            - run: pnpm run typecheck
            - run: pnpm run test:coverage
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-node-24
                  path: coverage
                  if-no-files-found: error
                  retention-days: 7

    runtime:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        continue-on-error: ${{ matrix.experimental }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - node: 22
                      experimental: false
                    - node: 24
                      experimental: false
                    - node: 26
                      experimental: true
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - run: pnpm run build
            - run: pnpm run test:browser

    package:
        name: Packed artifact
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run test:browser
            - run: pnpm run package:check
            - name: Pack once
              run: |
                  mkdir -p artifacts
                  pnpm pack --pack-destination artifacts
            - uses: actions/upload-artifact@v4
              with:
                  name: npm-package
                  path: artifacts/*.tgz
                  if-no-files-found: error
                  retention-days: 7

    compatibility:
        name: ${{ matrix.manager }} consumer
        needs: package
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                manager: [npm, pnpm, yarn, bun]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - if: matrix.manager == 'pnpm'
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - if: matrix.manager == 'yarn'
              name: Install Yarn
              run: |
                  npm install --global corepack@0.34.0
                  corepack enable
                  corepack prepare yarn@4.9.2 --activate
            - if: matrix.manager == 'bun'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.2.22
            - run: npm install --ignore-scripts
            - uses: actions/download-artifact@v5
              with:
                  name: npm-package
                  path: artifacts
            - run: node scripts/verify-packed-package.mjs ${{ matrix.manager }} artifacts/*.tgz

    security:
        name: Production dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod --audit-level moderate

    dependency-review:
        name: Dependency review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: moderate
