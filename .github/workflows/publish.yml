name: Publish

on:
    push:
        tags: ['v*']

permissions:
    contents: write
    id-token: write

concurrency:
    group: npm-production
    cancel-in-progress: false

jobs:
    npm:
        name: Publish verified package
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: npm-production
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ github.ref_name }}
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 9.15.4
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Require tag and package version parity
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node -e "const version = require('./package.json').version; const expected = 'v' + version; if (process.env.RELEASE_TAG !== expected) throw new Error('Release tag ' + process.env.RELEASE_TAG + ' does not match package ' + expected)"
            - run: npm install --global npm@11
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check
            - name: Require reproducible generated artifacts
              run: git diff --exit-code -- dist types
            - name: Create and verify the immutable package artifact
              run: |
                  mkdir -p artifacts
                  pnpm pack --pack-destination artifacts
                  pnpm run package:artifact artifacts/*.tgz
                  node scripts/verify-packed-package.mjs pnpm artifacts/*.tgz
                  sha256sum artifacts/*.tgz > artifacts/SHA256SUMS
            - name: Publish the verified bytes with provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  version="${RELEASE_TAG#v}"
                  dist_tag=latest
                  case "$version" in
                      *-*) dist_tag=next ;;
                  esac
                  package="@fleetbase/storefront@$version"
                  local_integrity="sha512-$(openssl dgst -sha512 -binary artifacts/*.tgz | openssl base64 -A)"
                  published_integrity="$(npm view "$package" dist.integrity 2>/dev/null || true)"
                  if [ -n "$published_integrity" ]; then
                      test "$published_integrity" = "$local_integrity"
                      echo "$package already contains the verified release bytes"
                  else
                      npm publish ./artifacts/*.tgz --access public --tag "$dist_tag"
                  fi
            - name: Verify registry metadata
              env:
                  PACKAGE_VERSION: ${{ github.ref_name }}
              run: |
                  expected="${PACKAGE_VERSION#v}"
                  # npm can take minutes to serve a version it has just accepted; keep asking
                  # for about ten minutes before failing.
                  for delay in 10 15 20 30 45 60 60 60 60 60 60 60 60 60 0; do
                      actual="$(npm view @fleetbase/storefront@"$expected" version 2>/dev/null || true)"
                      if [ "$actual" = "$expected" ]; then
                          exit 0
                      fi
                      sleep "$delay"
                  done
                  echo "::error::@fleetbase/storefront@$expected did not become available from the registry."
                  exit 1
            - name: Create the GitHub Release and attach verified artifacts
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file RELEASE.md
                  else
                      gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE.md
                  fi
                  gh release upload "$RELEASE_TAG" artifacts/*.tgz artifacts/SHA256SUMS --clobber
