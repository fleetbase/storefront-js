name: Publish

on:
    release:
        types: [published]

permissions:
    contents: write
    id-token: write

concurrency:
    group: npm-production
    cancel-in-progress: false

jobs:
    npm:
        name: Publish verified package
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: npm-production
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ github.event.release.tag_name }}
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 9.15.4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Require tag and package version parity
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: node -e "const version = require('./package.json').version; const expected = 'v' + version; if (process.env.RELEASE_TAG !== expected) throw new Error('Release tag ' + process.env.RELEASE_TAG + ' does not match package ' + expected)"
            - run: npm install --global npm@11
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check
            - name: Require reproducible generated artifacts
              run: git diff --exit-code -- dist types
            - name: Create and verify the immutable package artifact
              run: |
                  mkdir -p artifacts
                  pnpm pack --pack-destination artifacts
                  pnpm run package:artifact artifacts/*.tgz
                  node scripts/verify-packed-package.mjs pnpm artifacts/*.tgz
                  sha256sum artifacts/*.tgz > artifacts/SHA256SUMS
            - name: Publish the verified bytes with provenance
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="${RELEASE_TAG#v}"
                  dist_tag=latest
                  case "$version" in
                      *-*) dist_tag=next ;;
                  esac
                  npm publish artifacts/*.tgz --access public --tag "$dist_tag"
            - name: Verify registry metadata
              env:
                  PACKAGE_VERSION: ${{ github.event.release.tag_name }}
              run: |
                  expected="${PACKAGE_VERSION#v}"
                  actual="$(npm view @fleetbase/storefront@"$expected" version)"
                  test "$actual" = "$expected"
            - name: Attach package and checksum to the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.tgz artifacts/SHA256SUMS --clobber
